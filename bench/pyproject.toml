[project]
name = "atlas-bench"
version = "0.1.0"
description = "Inference Atlas benchmark harness: measure LLM serving engines and emit Atlas result files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Inference Atlas contributors" }]
keywords = ["llm", "benchmark", "inference", "vllm", "sglang", "llama.cpp"]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "psutil>=5.9",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
# Vision eval rows (resize/convert local images before base64-encoding them).
vision = ["pillow>=10.3"]
# Richer GPU telemetry than the nvidia-smi subprocess sampler.
telemetry = ["nvidia-ml-py>=12.555"]
# Only needed for `--tokenizer <hf-id>`; engine usage fields are the default token source.
tokenizer = ["tokenizers>=0.19"]
# GGUF downloads for the llama.cpp adapter.
hf = ["huggingface-hub>=0.23"]
all = [
    "pillow>=10.3",
    "nvidia-ml-py>=12.555",
    "tokenizers>=0.19",
    "huggingface-hub>=0.23",
]

[project.scripts]
atlas-bench = "atlas_bench.cli:main"

[project.urls]
Homepage = "https://github.com/0xBakeer/inference-atlas"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:atlas_bench.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
