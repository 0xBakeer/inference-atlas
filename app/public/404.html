<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inference Atlas</title>
    <script>
      // GitHub Pages serves this for unknown paths. Every real route lives in the hash, so
      // any deep link that reached here was a path typo or a base-path mismatch: send it to
      // the index and keep whatever hash it carried.
      (function () {
        var segments = location.pathname.split('/').filter(Boolean);
        // Base path is the first segment for project pages (/<repo>/), nothing for user pages.
        var base = segments.length > 0 ? '/' + segments[0] + '/' : '/';
        var target = base + (location.hash || '#/');
        location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
