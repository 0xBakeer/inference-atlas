name: Add a model
description: A model — or a quantization of one — the registry does not know yet.
title: 'model: <hf-owner>/<hf-name>'
labels: [registry, model]
body:
  - type: markdown
    attributes:
      value: |
        Adding a model is a pull request that adds `models/<owner>/<name>/model.json`, plus
        one `models/<owner>/<name>/quants/<quant-id>.json` per quantization. Facts come from
        the model's `config.json` and its model card, **not from the launch blog post**.

        There is no id to invent: the model id **is** the Hugging Face repo id, verbatim and
        case-preserved, and it is the directory the record lives in. A fine-tune or a
        re-upload by another account is a different repo and therefore a different model.

  - type: input
    id: hf_id
    attributes:
      label: Hugging Face repo id
      description: >
        Exactly as it appears on the Hub, case included — this becomes both the `id` and the
        `models/<owner>/<name>/` directory.
      placeholder: Qwen/Qwen3-4B
    validations:
      required: true

  - type: input
    id: params
    attributes:
      label: Total and active parameters (B)
      description: >
        `active_params_b` is what the bandwidth plausibility bound is computed from, and for
        a dense model it equals the total. For an MoE it is the routed-active count, which
        is the whole reason a 30B-A3B decodes like a 3B.
      placeholder: 4 total, 4 active
    validations:
      required: true

  - type: input
    id: context
    attributes:
      label: Context length and licence
      placeholder: 262144, Apache-2.0
    validations:
      required: true

  - type: textarea
    id: quants
    attributes:
      label: Quantizations to register
      description: >
        One per line: the short quant id, format, resident size in GB, which engines can load
        it, the Hugging Face repo the weights come from, and whether that repo is official,
        community or self-quantized. `size_gb` should be measured if you can; say so if you
        estimated it.
      placeholder: |
        bf16 — bf16, 8.0 GB, vllm sglang tgi, Qwen/Qwen3-4B, official
        gguf-q4-k-m — gguf, 2.5 GB, llamacpp ollama lmstudio, unsloth/Qwen3-4B-GGUF, community (unverified)
