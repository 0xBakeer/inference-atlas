name: Submit a result
description: You have the hardware and the numbers but not a checkout. Paste them here and a pull request is opened in your name.
title: 'results: <engine> <version> <hf-owner>/<hf-name>/<quant> on <hardware>'
labels: [submit-result]
body:
  - type: markdown
    attributes:
      value: |
        This form becomes a result file and a pull request **owned by you** — your GitHub
        login goes into `provenance.github_login` and nobody else can change the file
        afterwards.

        You never fill in ids, hashes or paths: `run_id`, `config_id`, `cell_id`, the
        canonical argument string and the file location are all computed from what you
        write here.

        The field labels below are read by the automation. If a value you need is not in
        the registry yet (a device, a model, a quantization), open the matching template
        first — a result that references something unregistered cannot be merged.

  - type: input
    id: engine
    attributes:
      label: Engine
      description: The engine id as it appears under `engines/` — `vllm`, `sglang`, `llamacpp`, `ollama`, `mlx-lm`, …
      placeholder: vllm
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Engine version
      description: Exactly as the engine reports it. `0.27.1`, `b7000`, `0.12.11`.
      placeholder: 0.27.1
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      description: >
        The Hugging Face repo id of the model, exactly as it is written on the Hub —
        case included. That *is* the model id, and it is the directory it lives in under
        `models/<owner>/<name>/`.
      placeholder: Qwen/Qwen3-8B
    validations:
      required: true

  - type: input
    id: quant
    attributes:
      label: Quantization
      description: >
        The quant id under `models/<owner>/<name>/quants/` — the short id (`fp8`,
        `gguf-q4-k-m`), not the repo the weights came from.
      placeholder: fp8
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: The device id under `hardware/`.
      placeholder: nvidia-rtx-4090
    validations:
      required: true

  - type: input
    id: devices
    attributes:
      label: Device count
      description: How many of that device the run used. Multi-node is out of scope.
      value: '1'
    validations:
      required: true

  - type: input
    id: workload
    attributes:
      label: Workload
      description: The workload id under `workloads/`. One workload per submission.
      placeholder: serve-single-i256-o256-v1
    validations:
      required: true

  - type: textarea
    id: args
    attributes:
      label: Engine args (JSON)
      description: >
        Exactly the flags you passed, as a JSON object — what you actually ran, not what you
        meant to run. Leave `{}` if you ran with defaults. Ports, paths and credentials are
        dropped from the fingerprint, so they do not matter here.
      render: json
      placeholder: |
        { "max-model-len": 32768, "gpu-memory-utilization": 0.9 }
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Results (JSON)
      description: >
        Either an Atlas metric block (`{"metrics": {...}}` or `{"scores": {...}}` for an
        eval) or the raw output of `vllm bench serve --save-result` / SGLang's
        `bench_serving.py --output-file`, which is converted for you. **Metrics you did not
        measure must be left out — never fill in a plausible-looking number.**
      render: json
    validations:
      required: true

  - type: input
    id: started
    attributes:
      label: Started at (UTC)
      description: When the run started, ISO-8601. Part of the run id. Taken from the pasted output when it carries a date.
      placeholder: 2026-08-12T14:15:22Z

  - type: input
    id: container
    attributes:
      label: Container image
      description: The exact image tag, if you ran the engine in a container.
      placeholder: vllm/vllm-openai:v0.27.1

  - type: textarea
    id: notes
    attributes:
      label: Conditions and notes
      description: >
        What the box was doing, what else was resident, ambient temperature if you know it,
        anything unusual. This is what makes the number readable a year from now.
      placeholder: Ambient 21C, box otherwise idle, nothing else on the GPU.
    validations:
      required: true

  - type: checkboxes
    id: honesty
    attributes:
      label: Before you submit
      options:
        - label: These are my own measurements, from a run I actually did.
          required: true
        - label: Every metric I filled in was measured; I left out the ones that were not.
          required: true
        - label: The box was idle apart from this run, or I said so above.
          required: true
