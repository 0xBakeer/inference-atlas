name: validate

# Every pull request, no exceptions: schemas, recomputed ids, physics and — the one that
# matters — ownership. SPEC §5. The job also posts what it found back onto the pull request,
# because a contributor whose first contribution fails a check they cannot see will not send
# a second one.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required, not an optimisation: ownership compares the file against
      # its previous version with `git show <base>:<path>`, which needs the history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch the base branch
        run: |
          git fetch --no-tags origin \
            +refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # `dist/` is gitignored, so the shared core has to be compiled before anything imports it.
      - run: pnpm --filter @atlas/core run build

      - name: Unit tests
        run: pnpm test

      - name: Collect the changed files
        id: changed
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD | tr '\n' ' ')
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "results=$(git diff --name-only "$BASE"...HEAD -- results/ | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Validate
        id: validate
        run: |
          # --json-out, not `--json > validate.json`: on a failing validation pnpm appends its
          # own ELIFECYCLE block to the same stdout, which left the file as JSON plus trailing
          # text and made the read below throw a SyntaxError. The findings were then never
          # posted -- exactly on the pull requests that needed them most.
          set +e
          pnpm --filter @atlas/tools exec tsx src/validate.ts \
            --changed ${{ steps.changed.outputs.files }} \
            --pr-author '${{ github.event.pull_request.user.login }}' \
            --base '${{ steps.changed.outputs.base }}' \
            ${{ contains(github.event.pull_request.labels.*.name, 'maintainer-override') && '--allow-override' || '' }} \
            --json-out validate.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          node -e "const r=require('./validate.json');console.log(r.markdown)"

      - name: Comment on the pull request
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('validate.json', 'utf8'));
            const marker = '<!-- inference-atlas: validate -->';
            const body = [
              marker,
              '### Validation',
              '',
              report.markdown,
              '',
              '<sub>`pnpm validate` runs the same checks locally.</sub>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            // Labels follow the issue codes, so triage is driven by the same vocabulary the
            // validator reports in.
            const codes = new Set(report.codes ?? []);
            const wanted = [];
            if (codes.has('needs-review')) wanted.push('needs-review');
            if (Number('${{ steps.changed.outputs.results }}') > 0) wanted.push('results');
            if (wanted.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: wanted });
            }

      - name: Fail if validation found errors
        if: steps.validate.outputs.exit != '0'
        run: |
          echo "validation failed — see the pull request comment for the full report"
          exit 1

  # Resolving the login to a numeric id is a write to the contributor's branch, so it is a
  # separate job with its own permissions, and it only runs for branches in this repository:
  # a pull request from a fork cannot be pushed to with the default token. For forks the id
  # stays null until the build resolves it on main, which is why nothing downstream may
  # depend on it being set.
  stamp-user-ids:
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/core run build

      - name: Resolve GitHub user ids
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags origin +refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- results/ | tr '\n' ' ')
          if [ -z "$CHANGED" ]; then echo "no result files changed"; exit 0; fi
          pnpm --filter @atlas/tools exec tsx src/resolve-user.ts --changed $CHANGED

      - name: Push the stamp
        run: |
          if git diff --quiet; then echo "nothing to stamp"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore: stamp github_user_id'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
