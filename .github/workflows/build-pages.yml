name: build-pages

# main → GitHub Pages. `pnpm build` compiles the repository into app/public/data (where the
# provenance stamps are derived from git history — see tools/build.ts) and then builds the
# app around it. fetch-depth: 0 is what makes the stamping possible at all.
#
# No benchmark runs here, and none ever will: CI validates and builds (SPEC §10). Every
# number under `results/` was measured on a contributor's own machine and submitted by them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/core run build
      - run: pnpm test

      - name: Validate before publishing
        run: pnpm --filter @atlas/tools exec tsx src/validate.ts

      - name: Compile the data and build the site
        env:
          # The site lives under /<repo>/ on github.io; site/config.json carries the same
          # value for the app's own links.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
