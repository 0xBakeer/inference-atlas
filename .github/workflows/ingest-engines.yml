name: ingest-engines

# DESIGN §3.4: the flag list of an engine version is read out of the engine, not typed into
# a file by hand. Nightly, this asks the GitHub releases API which versions exist that the
# registry does not have, runs the argparse introspection inside that version's container,
# and opens one pull request per version.
#
# It runs on a plain CPU runner on purpose: building an argparse parser imports no CUDA and
# starts no model, so the whole job is a container pull and a few seconds of Python. A GPU
# runner would buy nothing.

# The nightly schedule is off: the only engine being measured right now is lmstudio, whose
# flags are not introspectable from a container, so every scheduled run was a multi-gigabyte
# vllm image pull that failed on runner disk and reported nothing. Dispatch it by hand when a
# vllm/sglang version is actually wanted; restore the cron when those engines are back in the
# measurement plan.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine id (vllm, sglang, …). Leave empty to check every engine.
        required: false
        type: string
      version:
        description: A single version to ingest. Requires `engine`.
        required: false
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out what is missing
        id: plan
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const only = '${{ inputs.engine }}';
            const pinned = '${{ inputs.version }}';

            // Only the engines whose flags we can introspect: the others are ingested from
            // help text, which needs the engine installed rather than a container pull.
            const SUPPORTED = ['vllm', 'sglang'];
            const plan = [];

            for (const id of SUPPORTED) {
              if (only && id !== only) continue;
              const metaPath = `engines/${id}/meta.json`;
              if (!fs.existsSync(metaPath)) continue;
              const meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
              const have = new Set(meta.versions_available ?? []);

              if (pinned) {
                if (!have.has(pinned)) plan.push({ engine: id, version: pinned });
                continue;
              }

              const source = meta.version_source ?? {};
              if (source.kind !== 'github-releases' || !source.repo) continue;
              const [owner, repo] = source.repo.split('/');
              const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 20 });
              const prefix = source.tag_prefix ?? '';
              for (const release of releases.data) {
                if (release.draft || release.prerelease) continue;
                const version = release.tag_name.startsWith(prefix)
                  ? release.tag_name.slice(prefix.length)
                  : release.tag_name;
                // Stable dotted versions only: rc/dev/nightly tags are not what anybody runs.
                if (!/^\d+\.\d+(\.\d+)?$/.test(version)) continue;
                if (have.has(version)) continue;
                plan.push({ engine: id, version });
              }
            }

            const matrix = plan.slice(0, 4);
            core.setOutput('matrix', JSON.stringify(matrix));
            core.info(`planned: ${JSON.stringify(matrix)}`);

  ingest:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/core run build

      - name: Ingest ${{ matrix.engine }} ${{ matrix.version }}
        run: |
          pnpm --filter @atlas/tools exec tsx src/ingest/index.ts \
            --engine '${{ matrix.engine }}' \
            --version '${{ matrix.version }}' \
            --method docker

      - name: Validate the result
        run: pnpm --filter @atlas/tools exec tsx src/validate.ts

      - uses: peter-evans/create-pull-request@v6
        with:
          branch: engines/${{ matrix.engine }}-${{ matrix.version }}
          title: 'chore(engines): ${{ matrix.engine }} ${{ matrix.version }}'
          commit-message: 'chore(engines): ${{ matrix.engine }} ${{ matrix.version }}'
          labels: engines
          body: |
            Generated by `ingest-engines.yml` from the engine itself
            (`${{ matrix.engine }}` ${{ matrix.version }}, argparse introspection inside the
            release container).

            **What to check before merging**

            - Defaults are load-bearing: canonicalization drops any flag whose value equals
              the default, so a wrong default silently merges two different configurations
              into one fingerprint. Spot-check the flags in `engines/${{ matrix.engine }}/overlay.json`
              that are marked `impact: high`.
            - Flags whose default depends on the model must be `null`, not a guessed constant.
            - Existing results are not re-fingerprinted by this pull request; a changed
              default only affects runs submitted against this new version.
