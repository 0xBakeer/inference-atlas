name: wanted-snapshot

# "Somebody asked for this" is a ranking signal for the wanted queue, and the only place it
# lives is in issues labelled `request-config` and the reactions on them. Once a week that
# is snapshotted into `site/wanted-requests.json`, which `tools/build` reads when it ranks
# the gaps (see `computeGaps`). Going through a committed file rather than calling the API
# at build time keeps the build hermetic and the ranking reviewable in a diff.

on:
  schedule:
    - cron: '15 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect the open requests
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: 'request-config', state: 'open', per_page: 100,
            });

            // The issue form (`request-config.yml`) uses these labels; the app pre-fills
            // them through URL parameters from whichever cell the visitor was looking at.
            const FIELDS = {
              engine_id: 'Engine',
              model_id: 'Model',
              quant_id: 'Quantization',
              hardware_id: 'Hardware',
              workload_id: 'Workload',
            };
            const readField = (body, label) => {
              const pattern = new RegExp(`^###\\\\s+${label}\\\\s*$([\\\\s\\\\S]*?)(?=^###\\\\s|\\\\Z)`, 'm');
              const match = pattern.exec(body ?? '');
              if (!match) return null;
              const value = match[1].trim();
              if (!value || /^_?no response_?$/i.test(value)) return null;
              return value.split('\\n')[0].trim();
            };

            const requests = issues
              .filter((issue) => !issue.pull_request)
              .map((issue) => {
                const entry = { issue: issue.number, title: issue.title };
                for (const [key, label] of Object.entries(FIELDS)) {
                  entry[key] = readField(issue.body, label);
                }
                const reactions = issue.reactions ?? {};
                entry.reactions =
                  (reactions['+1'] ?? 0) + (reactions.heart ?? 0) + (reactions.rocket ?? 0);
                return entry;
              })
              .filter((entry) => entry.engine_id || entry.model_id || entry.hardware_id)
              .sort((a, b) => b.reactions - a.reactions || a.issue - b.issue);

            fs.mkdirSync('site', { recursive: true });
            fs.writeFileSync(
              'site/wanted-requests.json',
              JSON.stringify(
                {
                  schema_version: 1,
                  generated_at: new Date().toISOString(),
                  requests,
                },
                null,
                2,
              ) + '\n',
            );
            core.info(`${requests.length} request(s) snapshotted`);

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/wanted-snapshot
          add-paths: site/wanted-requests.json
          title: 'chore(site): refresh the wanted-config snapshot'
          commit-message: 'chore(site): refresh the wanted-config snapshot'
          labels: site
          body: |
            Weekly snapshot of the open `request-config` issues and their reactions.
            `tools/build` reads this file when it ranks `gaps.json`, so merging it moves
            requested cells up the wanted queue.
